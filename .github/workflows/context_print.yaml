name: Extract GitHub Context Variables
on: [workflow_dispatch]

jobs:
  extract_metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Print Context Variables
        run: |
          echo "The repository is: ${{ github.repository }}"
          echo "The workflow was triggered by: ${{ github.actor }}"
          echo "The event that triggered this run is: ${{ github.event_name }}"
          
      - name: Extract Specific Event Data
        # Example of drilling down into the github.event object
        if: github.event_name == 'pull_request'
        run: |
          echo "Pull Request Title: ${{ github.event.pull_request.title }}"
          echo "Pull Request Action: ${{ github.event.action }}"
