name: Environment Demo Workflow

on:
  workflow_dispatch

jobs:
  deploy-to-prod:
    runs-on: ubuntu-latest
    environment: 
      name: Prod
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Environment Secrets and Variables
        env:
          DATABASE_ENV: ${{ vars.env }}          # Plain-text environment variable
          DEPLOY_TOKEN: ${{ secrets.secret }}  # Encrypted environment secret
        run: |
          echo "Connecting to database at: $DATABASE_URL"
          echo "Executing deployment using secure token..."
